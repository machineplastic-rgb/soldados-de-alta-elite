 jump0:[['j1_1'],1,1], rise:[['j1_2'],1,1], rise2:[['j1_3'],1,1], apex:[['j1_4'],1,1], fall0:[['j1_5'],1,1], fall:[['j1_6'],1,1], land:[['j1_7'],1,1], pre:[['j1_0'],1,1],

// ---------- audio ----------
let AC=null,muted=false,master=null;
function audio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination)}catch(e){}}
function tone(f0,f1,dur,type,vol,delay){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol,hp,delay){if(!AC)return;const t=AC.currentTime+(delay||0),n=AC.sampleRate*dur|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=b;f.type='highpass';f.frequency.value=hp||800;g.gain.value=vol||.3;s.connect(f);f.connect(g);g.connect(master);s.start(t)}
// voz grave sintetizada: fuente de dientes de sierra + dos formantes (como una vocal) + aspereza y soplo
function vocal(a,b,dur,f1,f2,vol,rough){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),src=AC.createGain(),s2=AC.createGain();
 o.type='sawtooth';o2.type='square';o.frequency.setValueAtTime(a,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,b),t+dur);o2.frequency.setValueAtTime(a*.5,t);o2.frequency.exponentialRampToValueAtTime(Math.max(20,b*.5),t+dur);
 const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=20+Math.random()*12;lg.gain.value=a*.06*(rough||1);lfo.connect(lg);lg.connect(o.frequency);lfo.start(t);lfo.stop(t+dur+.05);
 src.gain.value=.7;s2.gain.value=.35;o.connect(src);o2.connect(s2);s2.connect(src);
 [[f1,1],[f2,.6]].forEach(([f,gn])=>{const bp=AC.createBiquadFilter(),gg=AC.createGain();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=4.5;gg.gain.value=gn;src.connect(bp);bp.connect(gg);gg.connect(g)});
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur);g.connect(master);o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05);noise(Math.min(.12,dur),vol*.3,900)}
const SFX={
 shot(){tone(2100,240,.17,'sawtooth',.16);tone(1050,110,.24,'sine',.26);tone(420,60,.16,'square',.12);noise(.07,.22,3500);tone(300,1500,.035,'triangle',.12)},   // zumbido de plasma
 grunt(k){if(k==='att')vocal(150,100,.16,650,1150,.5,1);else if(k==='jump'){if(Math.random()<.6)vocal(170,125,.13,520,1000,.42,1)}else if(k==='dash')vocal(135,85,.32,700,1200,.55,1.3);else if(k==='hurt')vocal(230,85,.4,800,1400,.7,2);else if(k==='die')vocal(190,45,1,700,1100,.7,2.5);else if(k==='win')vocal(120,150,.45,600,1000,.6,1)},
 jump(){tone(260,520,.16,'square',.1);SFX.grunt('jump')},
 land(){noise(.08,.25,200)},
 dash(){noise(.28,.35,500);tone(700,200,.25,'sawtooth',.1);SFX.grunt('dash')},
 hurt(){tone(380,90,.35,'sawtooth',.3);noise(.2,.3,300);SFX.grunt('hurt')},
 step(){noise(.04,.12,600)},
 die(){tone(220,35,.95,'sawtooth',.35);noise(.5,.3,150,.1)},
 win(){[392,523,659,784].forEach((f,i)=>tone(f,f,.18,'square',.15,i*.12))}
};
// voces: síntesis del navegador (español). Sin voz instalada, queda solo el grito sintetizado.
function voz(txt,pitch,rate){if(muted||!window.speechSynthesis)return;try{const u=new SpeechSynthesisUtterance(txt);u.lang='es-ES';u.pitch=pitch||.2;u.rate=rate||1.15;u.volume=1;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

const VOZ={ataque:()=>{if(Math.random()<.5)SFX.grunt('att')},dolor:()=>{},dash:()=>{},salto:()=>{},muerte:()=>SFX.grunt('die'),victoria:()=>SFX.grunt('win')};   // la voz del navegador suena robótica: de momento solo voz sintetizada grave
function scream(){tone(190,55,.6,'sawtooth',.28);tone(95,45,.6,'square',.12)}
(function(){const b=document.getElementById('fs'),d=document.documentElement,en=document.fullscreenEnabled||document.webkitFullscreenEnabled;
 if(!en){b.style.display='none';return}
 const tog=()=>{try{if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const p=(d.requestFullscreen||d.webkitRequestFullscreen).call(d,{navigationUI:'hide'});if(p&&p.then)p.then(()=>{try{screen.orientation.lock('landscape')}catch(_){}}).catch(()=>{})}}catch(_){}};
 b.onclick=tog;
 if('ontouchstart' in window)addEventListener('pointerdown',()=>{if(!document.fullscreenElement&&!document.webkitFullscreenElement)tog()},{once:true})})();
document.getElementById('mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:.5;if(muted&&window.speechSynthesis)speechSynthesis.cancel()};
// ---------- entrada ----------
const K={};const keymap={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowDown:'d',s:'d',ArrowUp:'u',w:'u',' ':'j',z:'j',k:'j',x:'f',j:'f',c:'t',l:'t',Shift:'t',h:'h',m:'m',v:'v',r:'rs'};
const pressed={};
addEventListener('keydown',e=>{audio();const k=keymap[e.key.length>1?e.key:e.key.toLowerCase()];if(k){K[k]=1;if(!pressed[k]){pressed[k]=1;edge(k)}e.preventDefault()}});
addEventListener('keyup',e=>{const k=keymap[e.key.length>1?e.key:e.key.toLowerCase()];if(k){K[k]=0;pressed[k]=0}});
let jumpQ=0,dashQ=0;
function edge(k){if(k==='j')jumpQ=.12;if(k==='t')dashQ=.12;if(k==='h')hurtMe();if(k==='v'&&!P.dead){P.win=1.1;SFX.win();VOZ.victoria()}if(k==='rs')respawn()}
const touchMap={bJ:'j',bF:'f',bT:'t'};
if('ontouchstart' in window||navigator.maxTouchPoints>0||/touch/.test(location.search))document.body.classList.add('touch');
// joystick virtual flotante (un solo círculo): izquierda/derecha = mover, arriba = apuntar arriba, abajo = agacharse
(function(){const zn=document.getElementById('zone'),kn=document.getElementById('knob');let pid=null,x0=0,y0=0;const R=60;
 const home=()=>{kn.style.left=Math.max(80,innerWidth*.1)+'px';kn.style.top=(innerHeight-Math.max(86,innerHeight*.2))+'px';kn.style.transform=''};
 const set=(dx,dy)=>{K.l=dx<-.28?1:0;K.r=dx>.28?1:0;K.u=dy<-.5?1:0;K.d=dy>.5?1:0};
 const mv=e=>{let dx=(e.clientX-x0)/R,dy=(e.clientY-y0)/R;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}kn.style.left=(x0+dx*R)+'px';kn.style.top=(y0+dy*R)+'px';set(dx,dy)};
 const end=()=>{pid=null;K.l=K.r=K.u=K.d=0;kn.classList.add('idle');home()};
 zn.addEventListener('pointerdown',e=>{e.preventDefault();audio();pid=e.pointerId;try{zn.setPointerCapture(pid)}catch(_){}x0=e.clientX;y0=e.clientY;kn.classList.remove('idle');mv(e)});
 zn.addEventListener('pointermove',e=>{if(e.pointerId===pid){e.preventDefault();mv(e)}});
 zn.addEventListener('pointerup',e=>{if(e.pointerId===pid)end()});zn.addEventListener('pointercancel',end);zn.addEventListener('lostpointercapture',end);
 addEventListener('resize',()=>{if(pid===null)home()});home()})();
Object.keys(touchMap).forEach(id=>{const el=document.getElementById(id),k=touchMap[id];
 const dn=e=>{e.preventDefault();audio();K[k]=1;el.classList.add('on');edge(k)},up=e=>{e.preventDefault();K[k]=0;pressed[k]=0;el.classList.remove('on')};
 el.addEventListener('pointerdown',dn);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up)});
// ---------- mundo: bosque encantado (2 tramos unidos) ----------
const GW=1172,GH=360;
const TERR=[[0,226],[100,228],[150,238],[200,250],[250,262],[300,276],[340,291],[450,293],[520,291],[580,270],[640,248],[720,242],[745,262],[775,280],[850,284],[880,292],[1000,296],[1040,280],[1080,274],[1172,276]];
function gY(x){if(x<=TERR[0][0])return TERR[0][1];for(let i=1;i<TERR.length;i++)if(x<=TERR[i][0]){const a=TERR[i-1],b=TERR[i],t=(x-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*t}return TERR[TERR.length-1][1]}
const FLOOR=gY(80);
const BG=new Image();BG.src='img/bg/bosque.jpg';
const PLAT=[{x:260,y:230,w:120},{x:470,y:175,w:120},{x:680,y:230,w:140},{x:900,y:170,w:150}];
const SOLID=PLAT.map(p=>({x:p.x,y:p.y,w:p.w,h:10,oneway:1}));
const TARGETS=[560,860,1100].map(x=>({x,y:gY(x)-34*PS,hp:3}));
// luciérnagas (partículas del motor)
const FLY=Array.from({length:42},(_,i)=>({x:Math.random()*GW,y:80+Math.random()*230,ph:Math.random()*6.3,sp:.4+Math.random()*.9,r:1.2+Math.random()*1.8}));
const tcv=document.createElement('canvas'),tcx=tcv.getContext('2d');
// ---------- jugador ----------
const P={x:80,y:FLOOR,vx:0,vy:0,dir:1,on:true,crouch:0,fire:0,flash:0,dash:0,dashCd:0,canDash:1,hp:5,inv:0,hurt:0,dead:0,win:0,t:0,stepT:0,coyote:0,state:'idle',fcount:0};
const BU=[],PART=[],GHO=[];let ghT=0;
function hurtMe(){if(P.inv>0||P.dead)return;P.hp--;P.inv=1.2;P.hurt=.45;P.vx=-P.dir*140;P.vy=-180;P.on=false;SFX.hurt();scream();VOZ.dolor();if(P.hp<=0){P.dead=1;P.vx=-P.dir*60;SFX.die();VOZ.muerte()}}
function respawn(){Object.assign(P,{x:80,y:FLOOR,vx:0,vy:0,hp:5,inv:1,hurt:0,dead:0,win:0,dash:0});TARGETS.forEach(t=>t.hp=3)}
const AIMV=[[1,0],[.707,-.707],[.25,-.97],[.707,.707],[.3,.95]];
const SPEED=150*PS,G=1000*PS,JV=-430*PS,DASHV=380*PS,DASHT=.22,HW=9*PS;   // física proporcional al tamaño
function step(dt){
 P.glow=Math.max(0,(P.glow||0)-dt*5.5);P.t+=dt;jumpQ=Math.max(0,jumpQ-dt);dashQ=Math.max(0,dashQ-dt);P.inv=Math.max(0,P.inv-dt);P.hurt=Math.max(0,P.hurt-dt);P.fire=Math.max(0,P.fire-dt);P.brake=Math.max(0,(P.brake||0)-dt);P.flash=Math.max(0,P.flash-dt);P.dashCd=Math.max(0,P.dashCd-dt);
 if(P.win>0&&!P.dead){P.win-=dt;P.vx=0;if(K.l||K.r||K.j||K.f||K.t||K.d)P.win=0;if(P.win<0)P.win=0}
 const lock=P.dead||P.hurt>0||P.win>0;
 const mv=(K.r?1:0)-(K.l?1:0);
 P.aim=K.u?(mv?1:2):((!P.on&&K.d)?(mv?3:4):0);
 P.crouch=(!lock&&P.on&&K.d&&P.dash<=0)?1:0;P.crAge=P.crouch?(P.crAge||0)+dt:0;
 if(!lock&&P.dash<=0){
  if(mv&&!P.crouch){P.vx=mv*SPEED;P.dir=mv}else if(P.crouch||!mv){P.vx*= P.on?0:.9;if(Math.abs(P.vx)<5)P.vx=0}
  if(mv&&!P.on&&!P.crouch){P.vx=mv*SPEED;P.dir=mv}
  if(mv&&P.crouch)P.dir=mv;
  // salto (con colchón de tiempo)
  if(jumpQ>0&&(P.on||P.coyote>0)&&!P.crouch){P.vy=JV;P.on=false;P.coyote=0;jumpQ=0;SFX.jump();VOZ.salto()}
  if(!K.j&&P.vy<-150&&!P.on)P.vy*=.86;     // salto variable
  // impulso
  if(dashQ>0&&P.dashCd<=0&&P.canDash){P.dash=DASHT;P.dashT=0;P.canDash=0;P.dashCd=.45;P.vy=0;dashQ=0;SFX.dash();VOZ.dash()}
  // disparo
  if(K.f&&P.fire<=0){shoot()}
 }
 if(P.dash>0){P.dash-=dt;P.dashT+=dt;P.vx=P.dir*DASHV;P.vy=0;if(P.dash<=0)P.brake=.2}
 else P.vy+=G*dt;
 if(P.vy>700)P.vy=700;
 // mover X
 P.x+=P.vx*dt;P.x=Math.max(14*PS,Math.min(GW-14*PS,P.x));
 // mover Y + suelo / plataformas
 const oy=P.y;P.y+=P.vy*dt;const was=P.on;P.on=false;
 if(P.vy>=0){const gy=gY(P.x);
  if(P.y>=gy&&oy<=gy+8*PS){P.y=gy;P.vy=0;P.on=true}                       // aterriza o sube la cuesta
  else if(was&&P.dash<=0&&gy>P.y&&gy-P.y<=9*PS){P.y=gy;P.vy=0;P.on=true}  // pegado al suelo al bajar la cuesta
  if(!P.on)for(const s of SOLID){if(P.x+HW>s.x&&P.x-HW<s.x+s.w&&oy<=s.y+1&&P.y>=s.y){P.y=s.y;P.vy=0;P.on=true;break}}}
 if(P.on){if(!was){SFX.land();P.landT=.14}P.canDash=1;P.coyote=.1}else P.coyote=Math.max(0,P.coyote-dt);
 P.landT=Math.max(0,(P.landT||0)-dt);
 // pasos
 if(P.on&&Math.abs(P.vx)>20){P.stepT-=dt;if(P.stepT<=0){SFX.step();P.stepT=.26}}
 // balas
 for(let i=BU.length-1;i>=0;i--){const b=BU[i];b.x+=b.vx*dt;b.y+=(b.vy||0)*dt;b.l-=dt;let hit=b.l<=0;
  for(const t of TARGETS)if(t.hp>0&&Math.abs(b.x-t.x)<14&&b.y>t.y-8&&b.y<t.y+40){t.hp--;t.hit=.12;hit=true;noise(.1,.3,900);if(t.hp<=0)SFX.win&&tone(200,60,.3,'square',.2)}
  if(hit)BU.splice(i,1)}
 for(const t of TARGETS)t.hit=Math.max(0,(t.hit||0)-dt);
 ghT-=dt;if(ghT<=0&&(P.dash>0||(!P.on&&P.vy>360))){ghT=P.dash>0?.025:.045;GHO.push({n:frame(),x:P.x,y:P.y,d:P.dir,l:P.dash>0?.22:.16,L:P.dash>0?.22:.16,a:P.dash>0?.5:.25})}
 for(let i=GHO.length-1;i>=0;i--){GHO[i].l-=dt;if(GHO[i].l<=0)GHO.splice(i,1)}
 for(let i=PART.length-1;i>=0;i--){PART[i].l-=dt;if(PART[i].l<=0)PART.splice(i,1)}
  // estado visual
 let s='idle';
 if(P.dead)s='dead';else if(P.hurt>0)s=P.on?'hurt':'fly';else if(P.win>0)s='win';else if(P.dash>0)s=P.dashT<.05?'dash0':'dash';

 else if(!P.on)s=P.vy<-380?'jump0':(P.vy<-230?'rise':(P.vy<-70?'rise2':(P.vy<70?'apex':(P.vy<200?'fall0':'fall'))));
 else if(P.on&&P.aim>0&&P.aim<3&&!P.crouch&&(K.f||P.fire>0||P.aim>0))s='aim'+P.aim;
 else if(P.landT>0)s='land';
 else if(P.brake>0&&!mv&&!P.crouch)s=P.brake>.09?'brake':'recov';
 else if(P.crouch)s=P.aim>0?'caim1':(P.crAge<.07?'crouchin':'crouch');
 else if(Math.abs(P.vx)<=20&&P.flash>0&&!K.u)s=(P.shotN&1)?'flash2':'flash';
 else if(Math.abs(P.vx)<=20&&(K.f||P.fire>0))s='aim0';
 else if(Math.abs(P.vx)>20)s='run';

 if(s!==P.state){P.state=s;P.ft=0}else P.ft=(P.ft||0)+dt;
}
function shoot(){
 P.fire=.16;P.flash=.09;P.shotN=(P.shotN||0)+1;SFX.shot();VOZ.ataque();P.glow=1;
 // fotograma que se mostrará al apuntar: de él salen la punta del cañón y el ángulo real del fusil
 let fr=frame();if(P.aim>0)fr=P.crouch?'a1_6':['a1_0','a1_1','a1_2','a1_3','a1_4'][P.aim];else if(P.crouch)fr='a1_5';
 const m=SPR[fr],kz=SC*(m.sc||1)/(m.z||1),mx=P.x+P.dir*(m.tx-m.cx)*kz,my=P.y-(m.by-m.ty)*kz;
 let ax=1,ay=0;if(P.aim>0&&m.ax!==undefined){ax=m.ax;ay=m.ay}   // solo al apuntar se usa el ángulo medido del fusil; en carrera, horizontal
 BU.push({x:mx,y:my,vx:ax*P.dir*700,vy:ay*700,l:1.0,d:P.dir});
 PART.push({x:mx,y:my,l:.1,L:.1,v:1})
}
// ---------- dibujo (optimizado: capas pre-escaladas, texturas de luz y resolución interna limitada) ----------
const cv=document.getElementById('c'),cx=cv.getContext('2d',{alpha:false});let kk=1,cam=0,VW=640;
const RS=1.5;   // píxeles internos por unidad lógica: tope de resolución para que vaya fluido, también en pantalla completa
const FG=new Image();FG.src='img/bg/primer_plano.jpg';const FGP=1.3,FGW=1747.5;      // primer plano: parallax 1.3
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c};
let BGc=null,FGc=null,VIG=null;
const glowTex=(r,g,b,stops)=>{const c=mk(128,128),x=c.getContext('2d'),gr=x.createRadialGradient(64,64,0,64,64,64);stops.forEach(t=>gr.addColorStop(t[0],'rgba('+r+','+g+','+b+','+t[1]+')'));x.fillStyle=gr;x.fillRect(0,0,128,128);return c};
const TEX_BLUE=glowTex(100,180,255,[[0,1],[.45,.38],[1,0]]),TEX_FLY=glowTex(215,255,170,[[0,1],[1,0]]),TEX_FOG=glowTex(150,235,200,[[0,1],[1,0]]);
const TEX_RAY=(()=>{const c=mk(220,360),x=c.getContext('2d'),g=x.createLinearGradient(110,0,0,360);g.addColorStop(0,'rgba(190,255,200,1)');g.addColorStop(1,'rgba(190,255,200,0)');x.fillStyle=g;x.beginPath();x.moveTo(84,0);x.lineTo(144,0);x.lineTo(40,360);x.lineTo(-80,360);x.closePath();x.fill();return c})();
function prep(){
 if(!BGc&&BG.complete&&BG.naturalWidth){BGc=mk(GW*RS,GH*RS);const g=BGc.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(BG,0,0,BGc.width,BGc.height)}
 if(!FGc&&FG.complete&&FG.naturalWidth){const w=Math.round(FGW*RS),h=Math.round(GH*RS);FGc=mk(w,h);const g=FGc.getContext('2d',{willReadFrequently:true});g.imageSmoothingQuality='high';g.drawImage(FG,0,0,w,h);
  // el blanco del JPG pasa a transparente (las zonas oscuras conservan su color): se dibuja con alfa normal, más rápido que 'multiply'
  try{const id=g.getImageData(0,0,w,h),d=id.data;for(let i=0;i<d.length;i+=4){const mn=Math.min(d[i],d[i+1],d[i+2]),a=(255-mn)/255;if(a<.02){d[i+3]=0;continue}d[i]=(d[i]-mn)/a;d[i+1]=(d[i+1]-mn)/a;d[i+2]=(d[i+2]-mn)/a;d[i+3]=Math.round(a*255)}g.putImageData(id,0,0)}catch(e){FGc._raw=true}}
}
function fit(){const w=innerWidth,h=innerHeight;VW=Math.max(640,Math.min(860,w/h*GH));kk=RS;cv.width=Math.round(VW*RS);cv.height=Math.round(GH*RS);
 const sc=Math.min(w/VW,h/GH);cv.style.width=VW*sc+'px';cv.style.height=GH*sc+'px';cv.style.left=(w-VW*sc)/2+'px';cv.style.top=(h-GH*sc)/2+'px';
 VIG=mk(cv.width,cv.height);{const g=VIG.getContext('2d'),gr=g.createRadialGradient(VW/2*RS,GH*.55*RS,GH*.45*RS,VW/2*RS,GH*.55*RS,Math.max(GH*1.1,VW*.6)*RS);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,10,6,.45)');g.fillStyle=gr;g.fillRect(0,0,VIG.width,VIG.height)}
 document.getElementById('rot').style.display=(h>w&&document.body.classList.contains('touch'))?'flex':'none'}
addEventListener('resize',fit);fit();
function spr(n,x,y,dir,alpha){const m=SPR[n],im=IMG[n];if(!im.complete)return;cx.save();cx.globalAlpha=alpha==null?1:alpha;cx.translate(x,y);cx.scale(dir,1);
 const k=SC*(m.sc||1)/(m.z||1);cx.drawImage(im,-m.cx*k,-m.by*k,m.w*k,m.h*k);cx.restore()}
function sprTint(n,x,y,dir,alpha){const m=SPR[n],im=IMG[n];if(!im.complete||!im.naturalWidth)return;const k=SC*(m.sc||1)/(m.z||1),W=Math.ceil(m.w*k*kk),H=Math.ceil(m.h*k*kk);
 if(tcv.width<W||tcv.height<H){tcv.width=Math.max(tcv.width,W);tcv.height=Math.max(tcv.height,H)}else tcx.clearRect(0,0,W,H);
 tcx.globalCompositeOperation='source-over';tcx.drawImage(im,0,0,W,H);
 tcx.globalCompositeOperation='source-atop';tcx.fillStyle='rgba(26,92,70,.20)';tcx.fillRect(0,0,W,H);
 const gl=P.glow||0;if(gl>.02){tcx.fillStyle='rgba(95,180,255,'+(.40*gl)+')';tcx.fillRect(0,0,W,H);const rg=tcx.createLinearGradient(W*(dir>0?1:0),0,W*(dir>0?.35:.65),0);rg.addColorStop(0,'rgba(170,225,255,'+(.45*gl)+')');rg.addColorStop(1,'rgba(170,225,255,0)');tcx.fillStyle=rg;tcx.fillRect(0,0,W,H)}
 const g=tcx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(190,255,200,.10)');g.addColorStop(1,'rgba(0,20,10,.22)');tcx.fillStyle=g;tcx.fillRect(0,0,W,H);tcx.globalCompositeOperation='source-over';
 cx.save();cx.globalAlpha=alpha==null?1:alpha;cx.translate(x,y);cx.scale(dir,1);cx.drawImage(tcv,0,0,W,H,-m.cx*k,-m.by*k,W/kk,H/kk);cx.restore()}
function frame(){const a=AN[P.state]||AN.idle,i=a[2]?Math.floor((P.ft||0)*a[1])%a[0].length:0;return a[0][i]}
function draw(){
 if(!BGc||!FGc)prep();
 cx.setTransform(1,0,0,1,0,0);cx.imageSmoothingQuality='medium';cx.globalCompositeOperation='source-over';cx.globalAlpha=1;
 cam+=(Math.max(0,Math.min(GW-VW,P.x-VW/2))-cam)*.12;
 if(BGc)cx.drawImage(BGc,Math.min(Math.round(cam*RS),BGc.width-cv.width),0,cv.width,cv.height,0,0,cv.width,cv.height);else{cx.fillStyle='#06241d';cx.fillRect(0,0,cv.width,cv.height)}
 cx.setTransform(kk,0,0,kk,0,0);cx.translate(-Math.round(cam),0);
 const T=performance.now()/1000;
 // plataformas de prueba: troncos oscuros
 PLAT.forEach(p=>{cx.fillStyle='#12261d';cx.fillRect(p.x,p.y,p.w,10);cx.fillStyle='#5f8f45';cx.fillRect(p.x,p.y,p.w,2.5)});
 // dianas (marcadores)
 TARGETS.forEach(t=>{if(t.hp<=0)return;cx.fillStyle=t.hit>0?'#fff':'#b04030';cx.fillRect(t.x-10*PS,t.y,20*PS,34*PS);cx.fillStyle='#fff';cx.font='10px Arial';cx.textAlign='center';cx.fillText('DIANA',t.x,t.y-4)});
 // estelas del impulso
 GHO.forEach(g=>spr(g.n,g.x,g.y,g.d,g.a*g.l/g.L));
 // soldado
 const blink=P.inv>0&&!P.dead&&Math.floor(P.t*20)%2===0;
 if(P.on){cx.fillStyle='rgba(0,12,8,.35)';cx.beginPath();cx.ellipse(P.x,P.y+1,15*PS,3.2*PS,0,0,7);cx.fill()}
 sprTint(frame(),P.x-P.dir*(P.flash>0?3*(P.flash/.09):0),P.y+(P.state==='dead'?2:0),P.dir,blink?.35:1);
 // balas de plasma
 if(BU.length){cx.save();cx.globalCompositeOperation='lighter';cx.lineCap='round';BU.forEach(b=>{const tx=b.x-b.vx*.04,ty=b.y-(b.vy||0)*.04;cx.strokeStyle='rgba(40,120,255,.35)';cx.lineWidth=7;cx.beginPath();cx.moveTo(b.x,b.y);cx.lineTo(tx,ty);cx.stroke();cx.strokeStyle='rgba(120,200,255,.8)';cx.lineWidth=3.6;cx.beginPath();cx.moveTo(b.x,b.y);cx.lineTo(b.x-b.vx*.026,b.y-(b.vy||0)*.026);cx.stroke();cx.strokeStyle='#eaf8ff';cx.lineWidth=1.6;cx.beginPath();cx.moveTo(b.x,b.y);cx.lineTo(b.x-b.vx*.016,b.y-(b.vy||0)*.016);cx.stroke()});cx.restore()}
 // primer plano oscuro, opaco (alfa normal)
 if(FGc){cx.save();cx.setTransform(1,0,0,1,0,0);if(FGc._raw)cx.globalCompositeOperation='multiply';cx.drawImage(FGc,Math.min(Math.round(cam*FGP*RS),FGc.width-cv.width),0,cv.width,FGc.height,0,Math.round(10*RS),cv.width,FGc.height);cx.restore()}
 // niebla baja que se desplaza
 cx.globalAlpha=.13;for(let i=0;i<7;i++){const fx=((i*210+T*(5+i%3*3))%(GW+420))-210,fy=gY(fx)+8-(i%3)*10;cx.drawImage(TEX_FOG,fx-150,fy-70,300,140)}
 // rayos de luz, luz de plasma y luciérnagas (aditivos)
 cx.globalCompositeOperation='lighter';
 for(let i=0;i<4;i++){const rx=140+i*300+Math.sin(T*.25+i*2)*40;cx.globalAlpha=Math.max(0,.045+.03*Math.sin(T*.4+i*1.7));cx.drawImage(TEX_RAY,rx-110,0)}
 {const L=(x,y,r,a)=>{cx.globalAlpha=Math.min(1,a);cx.drawImage(TEX_BLUE,x-r,y-r,r*2,r*2)};
  BU.forEach(b=>L(b.x,b.y,52,.30));PART.forEach(p=>{if(p.v===1)L(p.x,p.y,48,.7*(p.l/p.L))});if((P.glow||0)>.03)L(P.x,P.y-42,160,.28*P.glow)}
 FLY.forEach(f=>{const px=f.x+Math.sin(T*f.sp+f.ph)*22,py=f.y+Math.cos(T*f.sp*.8+f.ph)*14,al=.35+.5*Math.sin(T*1.6+f.ph);if(al<=0)return;cx.globalAlpha=Math.min(1,al);cx.drawImage(TEX_FLY,px-f.r*5,py-f.r*5,f.r*10,f.r*10)});
 cx.globalCompositeOperation='source-over';cx.globalAlpha=1;
 // viñeta y HUD
 cx.setTransform(1,0,0,1,0,0);cx.drawImage(VIG,0,0);
 cx.setTransform(kk,0,0,kk,0,0);
 cx.fillStyle='#fff';cx.font='bold 13px Arial';cx.textAlign='left';
 cx.fillText('SOLDADOS DE ALTA ELITE · '+VERSION,10,18);
 for(let i=0;i<5;i++){cx.fillStyle=i<P.hp?'#e04040':'#444';cx.fillRect(10+i*18,26,14,12)}
 cx.fillStyle='#ddd';cx.font='11px Arial';cx.fillText('Estado: '+P.state+(P.canDash?'  ⚡ impulso listo':'  ⚡ recargando (toca suelo)'),10,54);
 if(!document.body.classList.contains('touch')){cx.fillText('◀▶/A D mover · ▼/S agachar · Espacio/Z salto · X/J fuego · C/Shift impulso · W/↑ apuntar arriba · ▼ en el aire abajo · H daño · V victoria · R reiniciar · M sonido',10,GH-8)}
 if(P.dead){cx.fillStyle='#000a';cx.fillRect(0,130,VW,80);cx.fillStyle='#fff';cx.font='bold 26px Arial';cx.textAlign='center';cx.fillText('MISIÓN FALLIDA',VW/2,172);cx.font='13px Arial';cx.fillText('Pulsa R o salta para reiniciar',VW/2,196)}
}
let last=performance.now(),started=false;
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;
 if(P.dead&&(K.j||K.rs)&&P.t>0)if(P.deadT===undefined||P.t-P.deadT>1){respawn();P.deadT=undefined}
 if(P.dead&&P.deadT===undefined)P.deadT=P.t;
 step(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
addEventListener('pointerdown',()=>audio(),{once:true});
</script></body></html>
